<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Digital Product Hub</title>

    <link rel="stylesheet" href="css/styles.css">

    <style>
        body{
            margin:0;
            font-family:Arial,Helvetica,sans-serif;
            background:#f4f6fb;
        }

        .login-container{
            width:380px;
            margin:80px auto;
            background:#fff;
            padding:30px;
            border-radius:12px;
            box-shadow:0 5px 20px rgba(0,0,0,.15);
        }

        h2{
            text-align:center;
            margin-bottom:25px;
        }

        input{
            width:100%;
            padding:12px;
            margin-bottom:15px;
            border:1px solid #ddd;
            border-radius:8px;
            font-size:16px;
            box-sizing:border-box;
        }

        button{
            width:100%;
            padding:12px;
            background:#2563eb;
            color:#fff;
            border:none;
            border-radius:8px;
            cursor:pointer;
            font-size:16px;
        }

        button:hover{
            background:#1d4ed8;
        }

        #message{
            margin-top:15px;
            text-align:center;
            color:red;
            font-weight:bold;
        }

        .register-link{
            margin-top:20px;
            text-align:center;
        }

        .register-link a{
            text-decoration:none;
            color:#2563eb;
            font-weight:bold;
        }
    </style>
</head>

<body>

<div class="login-container">

    <h2>Login</h2>

    <form id="loginForm">

        <input
            type="email"
            id="email"
            placeholder="Email"
            required
        >

        <input
            type="password"
            id="password"
            placeholder="Password"
            required
        >

        <button type="submit">
            Login
        </button>

    </form>

    <p id="message"></p>

    <div class="register-link">
        Don't have an account?
        <a href="register.html">Register</a>
    </div>

</div>

<script src="js/login.js"></script>

</body>
</html>
